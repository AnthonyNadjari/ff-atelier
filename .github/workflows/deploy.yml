name: Deploiement des sites

# Lancement à la main seulement (onglet Actions > « Deploiement des sites » > Run workflow). Par défaut, seuls les
# sites de `sites-en-ligne.json` (sites livrés, solde payé) sont redéployés : jamais une démo ni un prospect.
# Secrets à poser une fois (Settings > Secrets and variables > Actions) : CLOUDFLARE_API_TOKEN (jeton « Custom
# Token » : Account > Workers Scripts > Edit, Account > Cloudflare Pages > Edit, Zone > Zone > Read, Zone > DNS >
# Edit, Zone > Email Routing Rules > Edit) et CLOUDFLARE_ACCOUNT_ID. Sans eux, le job échoue au premier site.
# Le mode (Workers static assets par défaut, Pages si le site y est déjà) vient de sites/<slug>/hebergement.json :
# voir scripts/ff/hebergement.mjs et docs/DEPLOIEMENT.md § 2.1.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug du site a deployer (vide = tous les sites de sites-en-ligne.json)"
        required: false
        type: string

jobs:
  liste-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.liste.outputs.sites }}
    steps:
      - uses: actions/checkout@v4

      - name: Liste les sites a deployer (un slug donne, sinon sites-en-ligne.json)
        id: liste
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "sites=[\"${{ github.event.inputs.slug }}\"]" >> "$GITHUB_OUTPUT"
          else
            sites=$(jq -c '.' sites-en-ligne.json)
            echo "sites=$sites" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: liste-sites
    if: needs.liste-sites.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slug: ${{ fromJson(needs.liste-sites.outputs.sites) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build + garde « données de test » + wrangler (Workers ou Pages selon hebergement.json) + IndexNow : la même
      # commande qu'en local, pour qu'un déploiement CI et un déploiement du poste fassent exactement la même chose.
      - name: ff deploy ${{ matrix.slug }}
        run: node scripts/ff.mjs deploy ${{ matrix.slug }}

      # hebergement.json est réécrit par ff deploy (date, URL) : on le renvoie dans le dépôt pour qu'il reste la vérité.
      - name: Enregistre sites/${{ matrix.slug }}/hebergement.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/${{ matrix.slug }}/hebergement.json
          if git diff --cached --quiet; then echo "hebergement.json inchangé"; exit 0; fi
          git commit -m "ff deploy ${{ matrix.slug }} : hebergement.json"
          git pull --rebase origin main
          git push origin HEAD:main
