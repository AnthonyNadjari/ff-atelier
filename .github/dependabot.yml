# Dependabot (mises a jour de dependances npm), mensuel et groupe — voir docs/DEPLOIEMENT.md § Securite.
# Reference : https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Groupe : une seule PR mensuelle plutot qu'une PR par paquet (le repo a ~90 dependances
# @fontsource*/@fontsource-variable* a lui seul, voir package.json) — sinon Dependabot ouvrirait des
# dizaines de PR le meme jour pour un atelier d'une ou deux personnes qui ne peut pas toutes les
# relire individuellement.
#
# Majeures d'astro/tailwindcss ignorees : ce sont les deux dependances dont depend TOUT le pipeline
# de build (`astro.config.mjs`, `@tailwindcss/vite`, tokens de direction en CSS natif) — une montee
# majeure change souvent des comportements de build (voir docs/veille/performance.md § 2.1 sur les
# changements de moteur Tailwind v3->v4) et merite une lecture du changelog + un test manuel sur
# plusieurs sites avant d'etre acceptee, jamais un merge automatique silencieux. Les mineures/patchs
# de ces deux paquets restent groupes et proposes normalement (correctifs de securite compris).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      dependances-npm:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tailwindcss/vite'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions-github:
        patterns:
          - '*'
