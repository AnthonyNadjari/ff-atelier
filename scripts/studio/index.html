<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio</title>
<style>
  :root {
    --bg: #16171a;
    --bg-2: #1d1f23;
    --bg-3: #26282e;
    --border: #34363c;
    --text: #e7e7ea;
    --text-dim: #9a9ca3;
    --accent: #7c9eff;
    --accent-text: #0d1020;
    --danger: #ff6b6b;
    --warn: #e2b93b;
    --ok: #6bcf8f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  button, select, input { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  .app { display: flex; height: 100vh; }

  /* ---- panneau gauche ---- */
  .panel {
    width: 380px;
    min-width: 380px;
    overflow-y: auto;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 14px 14px 60px;
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .panel-head h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
  .panel-head .slug { color: var(--text-dim); font-size: 12px; }
  .section { margin: 16px 0; }
  .section > .label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); margin-bottom: 6px; font-weight: 600;
  }
  .hint { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
  .warn-text { color: var(--warn); font-size: 12px; margin-top: 6px; }

  /* segmented control */
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    flex: 1 1 auto; padding: 6px 8px; background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .seg button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .seg button:hover:not(.active) { border-color: var(--text-dim); }
  .seg button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* direction grid */
  .dir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dir-card {
    text-align: left; background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; cursor: pointer;
  }
  .dir-card:hover { border-color: var(--text-dim); }
  .dir-card.active { border-color: var(--accent); background: #22283c; }
  .dir-card .nom { font-weight: 700; text-transform: capitalize; font-size: 12.5px; }
  .dir-card .ambiance { color: var(--text-dim); font-size: 10.5px; margin-top: 2px; display: block; }
  .dir-card .metiers { color: var(--text-dim); font-size: 10px; margin-top: 3px; display: block; font-style: italic; }

  /* accent */
  .accent-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .accent-row label { width: 62px; color: var(--text-dim); font-size: 11px; }
  .accent-row input[type="range"] { flex: 1; }
  .accent-row .val { width: 32px; text-align: right; color: var(--text-dim); font-size: 11px; }
  .swatch-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .swatch { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }

  select, input[type="text"] {
    width: 100%; background: var(--bg-3); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 6px;
  }
  .field { margin: 8px 0; }
  .field label { display: block; color: var(--text-dim); font-size: 11px; margin-bottom: 3px; }
  .btn-line { display: flex; gap: 6px; }
  .btn-line button.small { flex: none; padding: 5px 8px; }
  button.ghost { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; cursor: pointer; color: var(--text-dim); }
  button.ghost:hover { color: var(--text); border-color: var(--text-dim); }

  /* composition */
  .section-row {
    display: flex; align-items: center; gap: 6px; background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 6px; margin-bottom: 5px;
  }
  .section-row .type { width: 78px; font-size: 11.5px; color: var(--text-dim); flex-shrink: 0; }
  .section-row select { flex: 1; padding: 4px 6px; }
  .section-row .mini { padding: 3px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--text-dim); flex-shrink: 0; }
  .section-row .mini:hover { color: var(--text); }
  .section-row .mini:disabled { opacity: 0.35; cursor: default; }
  .add-row select { margin-top: 4px; }

  .actions { position: sticky; bottom: -60px; background: var(--bg-2); padding-top: 10px; margin-top: 20px; border-top: 1px solid var(--border); }
  .actions .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .actions button {
    padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-3); cursor: pointer;
  }
  .actions button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
  .actions button:hover { border-color: var(--text-dim); }
  .autosave { display: flex; align-items: center; gap: 6px; margin: 10px 0 6px; color: var(--text-dim); font-size: 12px; }
  .status { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; min-height: 14px; word-break: break-word; }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--danger); white-space: pre-wrap; }

  /* ---- previsualisation ---- */
  .preview-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .preview-toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-2);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .device-toggle { display: flex; gap: 4px; }
  .device-toggle button { padding: 5px 10px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .device-toggle button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .grow { flex: 1; }
  .preview-frame-wrap { flex: 1; overflow: auto; background: #0b0b0d; display: flex; justify-content: center; }
  #preview { border: 0; height: 100%; width: 1280px; max-width: 100%; background: #fff; }
  .reload-btn { padding: 5px 10px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .reload-btn:hover { border-color: var(--text-dim); }

  /* ---- modeles ---- */
  .modeles-section { margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .modeles-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .modeles-head .chevron { color: var(--text-dim); font-size: 11px; transition: transform 0.15s; }
  .modeles-section.collapsed .chevron { transform: rotate(-90deg); }
  .modeles-body { margin-top: 8px; }
  .modeles-section.collapsed .modeles-body { display: none; }
  .modeles-search { margin-bottom: 8px; }
  .modeles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
  .modele-card {
    text-align: left; background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; cursor: pointer; padding: 0; display: flex; flex-direction: column;
  }
  .modele-card:hover { border-color: var(--text-dim); }
  .modele-card.active { border-color: var(--accent); }
  .modele-card .thumb {
    width: 100%; aspect-ratio: 16 / 10; background: var(--bg); display: block; object-fit: cover;
    border-bottom: 1px solid var(--border);
  }
  .modele-card .thumb-placeholder {
    width: 100%; aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--bg) 25%, var(--bg-3) 25%, var(--bg-3) 50%, var(--bg) 50%, var(--bg) 75%, var(--bg-3) 75%);
    background-size: 16px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px;
  }
  .modele-card .body { padding: 6px 8px 8px; }
  .modele-card .titre { font-weight: 700; font-size: 12px; display: block; }
  .modele-card .dh { color: var(--text-dim); font-size: 10.5px; display: block; margin-top: 1px; }
  .modele-card .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .modele-card .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 1px 6px; font-size: 9.5px; color: var(--text-dim); }
  .modeles-empty { color: var(--text-dim); font-size: 12px; padding: 10px 0; }
  .btn-regen { width: 100%; margin-top: 8px; padding: 7px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text); }
  .btn-regen:hover:not(:disabled) { border-color: var(--text-dim); }
  .btn-regen:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel">
    <div class="panel-head">
      <h1>Studio</h1>
      <span class="slug" id="slugLabel"></span>
    </div>

    <div class="modeles-section" id="modelesSection">
      <div class="modeles-head" id="modelesToggle">
        <span class="label" style="margin:0;">Modèles</span>
        <span class="chevron">▾</span>
      </div>
      <div class="modeles-body" id="modelesBody">
        <input type="text" class="modeles-search" id="modelesSearch" placeholder="Rechercher (titre, métier, direction)…" />
        <div class="modeles-grid" id="modelesGrid"></div>
        <button class="btn-regen" id="btnRegenVignettes" type="button">Régénérer les vignettes</button>
      </div>
    </div>

    <div class="section">
      <span class="label">Direction</span>
      <div class="dir-grid" id="dirGrid"></div>
    </div>

    <div class="section">
      <span class="label">Mouvement</span>
      <div class="seg" id="segMotion"></div>
    </div>

    <div class="section">
      <span class="label">Échelle</span>
      <div class="seg" id="segScale"></div>
    </div>

    <div class="section">
      <span class="label">Ton</span>
      <div class="seg" id="segTone"></div>
    </div>

    <div class="section">
      <span class="label">Séparateur</span>
      <div class="seg" id="segDivider"></div>
    </div>

    <div class="section">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span class="label" style="margin:0;">Accent</span>
        <button class="ghost" id="resetAccent" type="button">réinitialiser</button>
      </div>
      <div class="accent-row"><label for="accH">Teinte</label><input type="range" id="accH" min="0" max="360" step="1" /><span class="val" id="accHVal"></span></div>
      <div class="accent-row"><label for="accS">Saturation</label><input type="range" id="accS" min="0" max="100" step="1" /><span class="val" id="accSVal"></span></div>
      <div class="accent-row"><label for="accL">Luminosité</label><input type="range" id="accL" min="0" max="100" step="1" /><span class="val" id="accLVal"></span></div>
      <div class="swatch-row"><div class="swatch" id="swatch"></div><span class="hint" id="accentHint"></span></div>
    </div>

    <div class="section">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span class="label" style="margin:0;">Typographie</span>
        <button class="ghost" id="resetTypo" type="button">réinitialiser</button>
      </div>
      <div class="field"><label for="fontDisplay">Titres</label><select id="fontDisplay"></select></div>
      <div class="field"><label for="fontBody">Texte</label><select id="fontBody"></select></div>
    </div>

    <div class="section">
      <span class="label">Composition</span>
      <div class="field"><label for="navSel">Navigation</label><select id="navSel"></select></div>
      <div class="field"><label for="heroSel">Hero</label><select id="heroSel"></select></div>
      <div class="field"><label for="footerSel">Pied de page</label><select id="footerSel"></select></div>
      <div class="field">
        <label>Sections</label>
        <div id="sectionsList"></div>
        <div class="warn-text" id="dupWarning" hidden></div>
        <div class="add-row">
          <select id="addSection"></select>
        </div>
      </div>
    </div>

    <div class="section">
      <span class="label">Libellés</span>
      <div class="field"><label for="wDevis">Devis (bouton)</label><input type="text" id="wDevis" /></div>
      <div class="field"><label for="wCtaTitle">Titre du bandeau CTA</label><input type="text" id="wCtaTitle" /></div>
      <div class="field"><label for="wCtaText">Texte du bandeau CTA</label><input type="text" id="wCtaText" /></div>
      <div class="field"><label for="wContactTitle">Titre du contact</label><input type="text" id="wContactTitle" /></div>
      <div class="field"><label for="wContactText">Texte du contact</label><input type="text" id="wContactText" /></div>
    </div>

    <div class="actions">
      <label class="autosave"><input type="checkbox" id="autoSave" checked /> Enregistrement automatique</label>
      <div class="grid2">
        <button class="primary" id="btnSave" type="button">Enregistrer</button>
        <button class="danger" id="btnReset" type="button">Réinitialiser</button>
        <button id="btnFiger" type="button">Figer dans site.config.ts</button>
        <button id="btnRandom" type="button" hidden>Aléatoire</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </aside>

  <main class="preview-wrap">
    <div class="preview-toolbar">
      <div class="device-toggle" id="deviceToggle">
        <button data-w="1280" class="active" type="button">Bureau</button>
        <button data-w="820" type="button">Tablette</button>
        <button data-w="390" type="button">Mobile</button>
      </div>
      <button class="reload-btn" id="btnReload" type="button">↻ Recharger</button>
      <span class="grow"></span>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="preview" src="http://127.0.0.1:4321/" title="Aperçu du site"></iframe>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';
  const ASTRO_URL = 'http://127.0.0.1:4321/';
  const $ = (id) => document.getElementById(id);
  const SECTION_LABELS = { services: 'Services', about: 'À propos', proof: 'Avis', zones: 'Zones', process: 'Méthode', faq: 'FAQ', cta: 'CTA', contact: 'Contact' };

  let meta = null;       // /api/meta
  let base = null;       // valeurs effectives de site.config.ts + defauts schema
  let look = {};         // surcharges actuelles (sous-ensemble des 7 cles LOOK)
  let effective = null;  // base fusionne avec look — ce que l'UI affiche
  let layoutState = null; // copie de travail de effective.layout, toujours complete
  let saveTimer = null;
  let reloadTimer = null;
  let modeles = [];       // /api/modeles
  let modelesFilter = '';
  let appliedModele = null;

  function setStatus(text, kind) {
    const s = $('status');
    s.textContent = text;
    s.className = 'status' + (kind ? ' ' + kind : '');
  }

  function reloadPreview() {
    $('preview').src = ASTRO_URL + '?studio=' + Date.now();
  }

  function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(reloadPreview, 800);
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur HTTP ${res.status}`);
    return data;
  }

  function scheduleSave() {
    if (!$('autoSave').checked) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  }

  async function save() {
    try {
      const data = await api('POST', '/api/look', look);
      effective = data.effective || effective;
      const t = new Date();
      setStatus('Enregistré à ' + t.toLocaleTimeString('fr-FR'), 'ok');
      scheduleReload();
    } catch (e) {
      setStatus('Erreur à l’enregistrement : ' + e.message, 'error');
    }
  }

  async function loadAll() {
    meta = await api('GET', '/api/meta');
    const data = await api('GET', '/api/look');
    base = data.base;
    look = data.look || {};
    effective = data.effective;
    layoutState = { ...effective.layout, sections: (effective.layout.sections || []).map((s) => ({ ...s })) };
    $('slugLabel').textContent = data.slug;
    $('btnRandom').hidden = !meta.composerAvailable;
    renderAll();
  }

  // ---- modeles ----

  async function loadModeles() {
    try {
      const data = await api('GET', '/api/modeles');
      modeles = data.modeles || [];
      renderModeles();
    } catch (e) {
      $('modelesGrid').innerHTML = '<p class="modeles-empty">Erreur de chargement des modèles : ' + escapeHtml(e.message) + '</p>';
    }
  }

  function matchesFilter(m, q) {
    if (!q) return true;
    const hay = [m.titre, m.nom, m.look && m.look.direction, ...(m.metiers || [])].join(' ').toLowerCase();
    return hay.includes(q);
  }

  function renderModeles() {
    const grid = $('modelesGrid');
    grid.innerHTML = '';
    const q = modelesFilter.trim().toLowerCase();
    const filtered = modeles.filter((m) => matchesFilter(m, q));

    if (modeles.length === 0) {
      grid.innerHTML = '<p class="modeles-empty">Aucun modèle dans presets/*.json.</p>';
      return;
    }
    if (filtered.length === 0) {
      grid.innerHTML = '<p class="modeles-empty">Aucun modèle ne correspond à la recherche.</p>';
      return;
    }

    for (const m of filtered) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'modele-card' + (appliedModele === m.nom ? ' active' : '');
      card.title = m.description || m.titre;

      if (m.vignette) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.alt = m.titre;
        img.src = '/api/vignette/' + encodeURIComponent(m.nom) + '?v=' + (m._v || 0);
        img.onerror = () => {
          img.replaceWith(placeholderThumb());
        };
        card.appendChild(img);
      } else {
        card.appendChild(placeholderThumb());
      }

      const body = document.createElement('div');
      body.className = 'body';
      const dirHero = (m.look && m.look.direction ? m.look.direction : '?') + ' · ' + (m.look && m.look.layout ? m.look.layout.hero : '?');
      body.innerHTML =
        '<span class="titre">' + escapeHtml(m.titre) + '</span>' +
        '<span class="dh">' + escapeHtml(dirHero) + '</span>';
      if (m.metiers && m.metiers.length) {
        const chips = document.createElement('div');
        chips.className = 'chips';
        for (const met of m.metiers.slice(0, 4)) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = met;
          chips.appendChild(chip);
        }
        body.appendChild(chips);
      }
      card.appendChild(body);

      card.addEventListener('click', () => applyModele(m.nom));
      grid.appendChild(card);
    }
  }

  async function applyModele(nom) {
    setStatus('Application du modèle « ' + nom + ' »…');
    try {
      const data = await api('POST', '/api/modele', { nom });
      appliedModele = nom;
      look = data.saved || {};
      effective = data.effective || effective;
      layoutState = { ...effective.layout, sections: (effective.layout.sections || []).map((s) => ({ ...s })) };
      renderAll();
      renderModeles();
      setStatus('Modèle « ' + (data.titre || nom) + ' » appliqué.', 'ok');
      scheduleReload();
    } catch (e) {
      setStatus('Erreur en appliquant le modèle : ' + e.message, 'error');
    }
  }

  function placeholderThumb() {
    const div = document.createElement('div');
    div.className = 'thumb-placeholder';
    div.textContent = 'pas d’aperçu';
    return div;
  }

  $('modelesToggle').addEventListener('click', () => {
    $('modelesSection').classList.toggle('collapsed');
  });

  $('modelesSearch').addEventListener('input', (e) => {
    modelesFilter = e.target.value;
    renderModeles();
  });

  $('btnRegenVignettes').addEventListener('click', async () => {
    const btn = $('btnRegenVignettes');
    btn.disabled = true;
    const prevLabel = btn.textContent;
    btn.textContent = 'Régénération en cours (quelques minutes)…';
    setStatus('Régénération des vignettes en cours…');
    try {
      await api('POST', '/api/vignettes');
      setStatus('Vignettes régénérées.', 'ok');
      for (const m of modeles) m._v = (m._v || 0) + 1;
      await loadModeles();
    } catch (e) {
      setStatus('Erreur lors de la régénération des vignettes : ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = prevLabel;
    }
  });

  // ---- rendu ----

  function renderAll() {
    renderDirections();
    renderSeg('segMotion', meta.motion, effective.motion, (v) => { look.motion = v; renderDirIndependent(); scheduleSave(); });
    renderSeg('segScale', meta.scales, effective.scale, (v) => { look.scale = v; scheduleSave(); });
    renderSeg('segTone', meta.tones, layoutState.tone, (v) => { layoutState.tone = v; commitLayout(); });
    renderSeg('segDivider', meta.dividers, layoutState.divider, (v) => { layoutState.divider = v; commitLayout(); });
    renderAccent();
    renderTypography();
    renderCompositionSelects();
    renderSectionsList();
    renderAddSection();
    renderWording();
  }

  function renderDirIndependent() {} // place pour extensions futures

  function renderDirections() {
    const grid = $('dirGrid');
    grid.innerHTML = '';
    for (const d of meta.directions) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'dir-card' + (effective.direction === d.key ? ' active' : '');
      card.title = d.metiers.join(', ');
      card.innerHTML =
        '<span class="nom">' + escapeHtml(d.nom) + '</span>' +
        '<span class="ambiance">' + escapeHtml(d.ambiance) + '</span>' +
        '<span class="metiers">' + escapeHtml(d.metiers.slice(0, 4).join(', ')) + '</span>';
      card.addEventListener('click', () => {
        look.direction = d.key;
        effective.direction = d.key;
        renderDirections();
        scheduleSave();
      });
      grid.appendChild(card);
    }
  }

  function renderSeg(containerId, options, current, onPick) {
    const box = $(containerId);
    box.innerHTML = '';
    for (const opt of options) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = opt;
      b.className = current === opt ? 'active' : '';
      b.addEventListener('click', () => {
        if (current === opt) return;
        onPick(opt);
        renderAll();
      });
      box.appendChild(b);
    }
  }

  function renderAccent() {
    const a = look.accent || effective.accent || { h: 220, s: 40, l: 50 };
    $('accH').value = a.h;
    $('accS').value = a.s;
    $('accL').value = a.l;
    $('accHVal').textContent = a.h;
    $('accSVal').textContent = a.s + '%';
    $('accLVal').textContent = a.l + '%';
    $('swatch').style.background = 'hsl(' + a.h + ' ' + a.s + '% ' + a.l + '%)';
    $('accentHint').textContent = look.accent ? 'surcharge active' : 'couleur de la direction (glisser pour surcharger)';

    const update = () => {
      const val = { h: Number($('accH').value), s: Number($('accS').value), l: Number($('accL').value) };
      look.accent = val;
      $('accHVal').textContent = val.h;
      $('accSVal').textContent = val.s + '%';
      $('accLVal').textContent = val.l + '%';
      $('swatch').style.background = 'hsl(' + val.h + ' ' + val.s + '% ' + val.l + '%)';
      $('accentHint').textContent = 'surcharge active';
      scheduleSave();
    };
    $('accH').oninput = update;
    $('accS').oninput = update;
    $('accL').oninput = update;
    $('resetAccent').onclick = () => {
      delete look.accent;
      delete effective.accent;
      renderAccent();
      scheduleSave();
    };
  }

  function fontOptions(select, role) {
    select.innerHTML = '<option value="">— police de la direction —</option>';
    for (const f of meta.fonts) {
      if (f.role !== role && f.role !== 'both') continue;
      const opt = document.createElement('option');
      opt.value = f.key;
      opt.textContent = f.key + ' — ' + f.family.split(',')[0].replace(/['"]/g, '') + ' (' + f.mood + ')';
      select.appendChild(opt);
    }
  }

  function renderTypography() {
    fontOptions($('fontDisplay'), 'display');
    fontOptions($('fontBody'), 'body');
    $('fontDisplay').value = (look.typography && look.typography.display) || '';
    $('fontBody').value = (look.typography && look.typography.body) || '';

    const update = () => {
      const display = $('fontDisplay').value;
      const body = $('fontBody').value;
      const t = {};
      if (display) t.display = display;
      if (body) t.body = body;
      if (Object.keys(t).length) look.typography = t;
      else delete look.typography;
      scheduleSave();
    };
    $('fontDisplay').onchange = update;
    $('fontBody').onchange = update;
    $('resetTypo').onclick = () => {
      delete look.typography;
      renderTypography();
      scheduleSave();
    };
  }

  function commitLayout() {
    look.layout = { ...layoutState, sections: layoutState.sections.map((s) => ({ ...s })) };
    renderSectionsList();
    renderCompositionSelects();
    updateDupWarning();
    scheduleSave();
  }

  function renderCompositionSelects() {
    fillSelect($('navSel'), meta.variants.nav, layoutState.nav, (v) => { layoutState.nav = v; commitLayout(); });
    fillSelect($('heroSel'), meta.variants.hero, layoutState.hero, (v) => { layoutState.hero = v; commitLayout(); });
    fillSelect($('footerSel'), meta.variants.footer, layoutState.footer, (v) => { layoutState.footer = v; commitLayout(); });
    // Re-sync segmented tone/divider display (layoutState is the source of truth for them).
    renderSeg('segTone', meta.tones, layoutState.tone, (v) => { layoutState.tone = v; commitLayout(); });
    renderSeg('segDivider', meta.dividers, layoutState.divider, (v) => { layoutState.divider = v; commitLayout(); });
  }

  function fillSelect(select, options, current, onChange) {
    select.innerHTML = '';
    for (const opt of options) {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      if (opt === current) o.selected = true;
      select.appendChild(o);
    }
    select.onchange = () => onChange(select.value);
  }

  function renderSectionsList() {
    const box = $('sectionsList');
    box.innerHTML = '';
    layoutState.sections.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'section-row';
      const label = document.createElement('span');
      label.className = 'type';
      label.textContent = SECTION_LABELS[s.type] || s.type;
      row.appendChild(label);

      const sel = document.createElement('select');
      for (const v of (meta.variants[s.type] || [])) {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        if (v === s.variant) o.selected = true;
        sel.appendChild(o);
      }
      sel.onchange = () => { layoutState.sections[i].variant = sel.value; commitLayout(); };
      row.appendChild(sel);

      const up = document.createElement('button');
      up.className = 'mini'; up.type = 'button'; up.textContent = '↑'; up.title = 'Monter';
      up.disabled = i === 0;
      up.onclick = () => { swap(i, i - 1); };
      row.appendChild(up);

      const down = document.createElement('button');
      down.className = 'mini'; down.type = 'button'; down.textContent = '↓'; down.title = 'Descendre';
      down.disabled = i === layoutState.sections.length - 1;
      down.onclick = () => { swap(i, i + 1); };
      row.appendChild(down);

      const rm = document.createElement('button');
      rm.className = 'mini'; rm.type = 'button'; rm.textContent = '✕'; rm.title = 'Retirer';
      rm.onclick = () => { layoutState.sections.splice(i, 1); commitLayout(); };
      row.appendChild(rm);

      box.appendChild(row);
    });
    updateDupWarning();
  }

  function swap(i, j) {
    const arr = layoutState.sections;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    commitLayout();
  }

  function updateDupWarning() {
    const counts = {};
    for (const s of layoutState.sections) counts[s.type] = (counts[s.type] || 0) + 1;
    const dups = Object.keys(counts).filter((t) => counts[t] > 1);
    const w = $('dupWarning');
    if (dups.length) {
      w.hidden = false;
      w.textContent = '⚠ type(s) en double : ' + dups.map((t) => SECTION_LABELS[t] || t).join(', ');
    } else {
      w.hidden = true;
    }
  }

  function renderAddSection() {
    const select = $('addSection');
    const types = Object.keys(meta.variants).filter((t) => !['nav', 'hero', 'footer'].includes(t));
    select.innerHTML = '<option value="">+ ajouter une section…</option>';
    for (const t of types) {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = SECTION_LABELS[t] || t;
      select.appendChild(o);
    }
    select.onchange = () => {
      const t = select.value;
      if (!t) return;
      const variant = (meta.variants[t] || [])[0];
      layoutState.sections.push({ type: t, variant });
      select.value = '';
      commitLayout();
    };
  }

  function renderWording() {
    const w = { ...(base.wording || {}), ...(look.wording || {}) };
    $('wDevis').value = w.devis || '';
    $('wCtaTitle').value = w.ctaTitle || '';
    $('wCtaText').value = w.ctaText || '';
    $('wContactTitle').value = w.contactTitle || '';
    $('wContactText').value = w.contactText || '';
    const update = () => {
      look.wording = {
        devis: $('wDevis').value,
        ctaTitle: $('wCtaTitle').value,
        ctaText: $('wCtaText').value,
        contactTitle: $('wContactTitle').value,
        contactText: $('wContactText').value,
      };
      scheduleSave();
    };
    for (const id of ['wDevis', 'wCtaTitle', 'wCtaText', 'wContactTitle', 'wContactText']) {
      $(id).oninput = update;
    }
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---- boutons d'action ----

  $('btnSave').addEventListener('click', save);

  $('btnReset').addEventListener('click', async () => {
    try {
      const data = await api('DELETE', '/api/look');
      look = {};
      base = data.effective || base;
      effective = { ...base };
      layoutState = { ...effective.layout, sections: (effective.layout.sections || []).map((s) => ({ ...s })) };
      renderAll();
      setStatus('Réinitialisé (look.json supprimé).', 'ok');
      reloadPreview();
    } catch (e) {
      setStatus('Erreur : ' + e.message, 'error');
    }
  });

  $('btnFiger').addEventListener('click', async () => {
    setStatus('Fusion dans site.config.ts en cours (build de validation)…');
    try {
      const data = await api('POST', '/api/figer');
      look = {};
      base = data.base;
      effective = { ...base };
      layoutState = { ...effective.layout, sections: (effective.layout.sections || []).map((s) => ({ ...s })) };
      renderAll();
      setStatus('Figé dans site.config.ts. look.json supprimé, build validé.', 'ok');
      reloadPreview();
    } catch (e) {
      setStatus('Échec du figer : ' + e.message, 'error');
    }
  });

  $('btnRandom').addEventListener('click', async () => {
    setStatus('Composition aléatoire en cours…');
    try {
      const data = await api('POST', '/api/composer');
      base = data.base;
      look = data.look || {};
      effective = data.effective;
      layoutState = { ...effective.layout, sections: (effective.layout.sections || []).map((s) => ({ ...s })) };
      renderAll();
      setStatus('Nouvelle composition appliquée (graine ' + data.graine + ').', 'ok');
      scheduleReload();
    } catch (e) {
      setStatus('Erreur : ' + e.message, 'error');
    }
  });

  $('btnReload').addEventListener('click', reloadPreview);

  $('deviceToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-w]');
    if (!btn) return;
    for (const b of $('deviceToggle').querySelectorAll('button')) b.classList.remove('active');
    btn.classList.add('active');
    $('preview').style.width = btn.dataset.w + 'px';
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      save();
    }
  });

  loadAll().catch((e) => setStatus('Erreur de chargement : ' + e.message, 'error'));
  loadModeles();
})();
</script>
</body>
</html>
